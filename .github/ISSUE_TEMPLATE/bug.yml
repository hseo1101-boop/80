name: 버그·고증 오류
description: 말이 안 되는 장면, 틀린 사실, 화면 문제를 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options:
        - 게임 버그 (멈춤, 화면 깨짐, 저장 문제)
        - 개연성 문제 (말이 안 되는 사건)
        - 고증 오류 (연도·사실·용어)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 게임 버전
      placeholder: v0.19
  - type: input
    id: when
    attributes:
      label: 언제 생겼나요?
      placeholder: 예) 1793년 6월, 25세, 리옹 · 견직공
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      placeholder: 어떤 화면에서 무엇을 했더니 어떻게 되었는지 적어 주세요. 고증 오류라면 근거도 함께 알려 주시면 좋습니다.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 기기
      options:
        - 휴대폰
        - 컴퓨터
        - 태블릿
